spring.application.name=career-wave

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# TODO: 로컬 DB 스키마 동기화 후 validate로 복구
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.tomcat.max-swallow-size=11MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT — user (USER/COMPANY): access 30min, refresh 14days
jwt.user.secret=${JWT_USER_SECRET}
jwt.user.access-expiration=1800000
jwt.user.refresh-expiration=1209600000

# JWT — admin: access 15min, refresh 1day
jwt.admin.secret=${JWT_ADMIN_SECRET}
jwt.admin.access-expiration=900000
jwt.admin.refresh-expiration=86400000

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
# 로컬 개발 시 true로 설정하면 S3 실제 업로드 없이 가짜 URL 반환 (기본값: false)
aws.s3.mock-upload=${AWS_S3_MOCK_UPLOAD:false}

fastapi.base-url=${FASTAPI_BASE_URL}

webhook.secret=${WEBHOOK_SECRET}

websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}
