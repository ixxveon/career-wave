spring.application.name=career-wave

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT — user (USER/COMPANY): access 30min, refresh 14days
jwt.user.secret=${JWT_USER_SECRET}
jwt.user.access-expiration=1800000
jwt.user.refresh-expiration=1209600000

# JWT — admin: access 15min, refresh 1day
jwt.admin.secret=${JWT_ADMIN_SECRET}
jwt.admin.access-expiration=900000
jwt.admin.refresh-expiration=86400000
