# 로컬 개발용 프로파일 — PostgreSQL (localhost:5432)
# 실행 전 backend/.env 파일에 환경변수를 설정하세요 (backend/.env.example 참고)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

interview:
  internal-secret: ${INTERVIEW_INTERNAL_SECRET}

jwt:
  user:
    secret: ${JWT_USER_SECRET}
    access-expiration: 1800000
    refresh-expiration: 1209600000
  admin:
    secret: ${JWT_ADMIN_SECRET}
    access-expiration: 900000
    refresh-expiration: 86400000
