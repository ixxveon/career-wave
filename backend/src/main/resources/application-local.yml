# 로컬 개발용 프로파일 — PostgreSQL (localhost:5432)
# 실행 전 backend/.env 파일에 환경변수를 설정하세요 (backend/.env.example 참고)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

aws:
  s3:
    mock-upload: true
    bucket-name: mock-bucket
    region: ap-northeast-2

websocket:
  allowed-origins: "*"


# 로컬 로그 설정 — reactor.netty/io.netty DEBUG는 URI(serviceKey), request body(인증번호, 전화번호) 전문 출력
# NFR-002 위반 방지를 위해 WARN 으로 제한
logging:
  level:
    reactor.netty: WARN
    io.netty: WARN
    org.springframework.web.reactive: WARN

privacy:
  hash-secret: local-dev-privacy-hmac-secret-not-for-prod

toss:
  # true → 실 Toss 호출 없이 mock 게이트웨이 주입 (데모/시연용, 자동결제 계약 미개통 우회)
  # false(기본) → 실제 Toss 연동. 자세한 배경은 이슈 #986 참고
  mock: ${TOSS_MOCK:false}
  secret-key: ${TOSS_SECRET_KEY:mock-secret-not-used}   # mock=true 시 실 클라이언트 미생성이라 사용되지 않음
  billing-key-encryption-key: ${TOSS_BILLING_KEY_ENCRYPTION_KEY}

billing:
  reconciliation:
    max-minutes: 30        # RECONCILING 상태 최대 허용 시간 (초과 시 OPS 알림 로그)
    interval-ms: 300000    # 대사 스케줄러 실행 인터벌 (기본 5분)

jwt:
  user:
    secret: ${JWT_USER_SECRET}
    access-expiration: 1800000
    refresh-expiration: 1209600000
  admin:
    secret: ${JWT_ADMIN_SECRET}
    access-expiration: 10800000
    refresh-expiration: 86400000
