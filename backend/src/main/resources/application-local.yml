# 로컬 개발용 프로파일 — PostgreSQL (Homebrew localhost:5432)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careerwave}
    username: ${DB_USERNAME:careerwave}
    password: ${DB_PASSWORD:Mrq0827!}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  user:
    secret: ${JWT_USER_SECRET:local-user-secret-key-must-be-at-least-32-bytes!!}
    access-expiration: 1800000
    refresh-expiration: 1209600000
  admin:
    secret: ${JWT_ADMIN_SECRET:local-admin-secret-key-must-be-at-least-32-bytes!}
    access-expiration: 900000
    refresh-expiration: 86400000
