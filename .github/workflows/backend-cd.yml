name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Spring image
        run: |
          SPRING_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_SPRING_REPOSITORY }}:${IMAGE_TAG}
          docker build -t $SPRING_IMAGE ./backend
          docker push $SPRING_IMAGE

      - name: Build and push FastAPI image
        run: |
          FASTAPI_IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_FASTAPI_REPOSITORY }}:${IMAGE_TAG}
          docker build -t $FASTAPI_IMAGE ./fastapi
          docker push $FASTAPI_IMAGE

      - name: Get GitHub Actions runner IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Invalid runner IP: $RUNNER_IP"
            exit 1
          fi
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT

      - name: Allow SSH from runner IP
        run: |
          set +e
          OUTPUT=$(aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.APP_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32 2>&1)
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ] && ! echo "$OUTPUT" | grep -q "InvalidPermission.Duplicate"; then
            echo "$OUTPUT"
            exit $STATUS
          fi

      - name: Copy compose file to App1
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APP1_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP1_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ec2-user/career-wave"
          strip_components: 1

      - name: Deploy to App1
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP1_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP1_SSH_KEY }}
          script: |
            set -e
            cd ~/career-wave
            test -f .env || { echo "Missing ~/career-wave/.env"; exit 1; }
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/' .env || echo 'IMAGE_TAG=${{ env.IMAGE_TAG }}' >> .env

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login \
              --username AWS \
              --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Copy compose file to App2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.APP2_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP2_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/home/ec2-user/career-wave"
          strip_components: 1

      - name: Deploy to App2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP2_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP2_SSH_KEY }}
          script: |
            set -e
            cd ~/career-wave
            test -f .env || { echo "Missing ~/career-wave/.env"; exit 1; }
            grep -q '^IMAGE_TAG=' .env && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ env.IMAGE_TAG }}/' .env || echo 'IMAGE_TAG=${{ env.IMAGE_TAG }}' >> .env

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login \
              --username AWS \
              --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            docker compose pull
            docker compose up -d
            docker image prune -f

      - name: Remove SSH from runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.APP_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.runner-ip.outputs.ip }}/32 || true
