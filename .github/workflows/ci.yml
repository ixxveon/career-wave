name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant gradlew execute permission
        run: chmod +x backend/gradlew

      - name: Verify environment
        working-directory: backend
        run: |
          java -version
          for attempt in 1 2 3; do
            ./gradlew --version --no-daemon && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Gradle wrapper download failed. Retrying..."
            sleep 5
          done

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon --stacktrace --info
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Verify package
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run tests
        working-directory: frontend
        run: npm test

  fastapi:
    name: FastAPI Lint & Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fastapi/requirements.txt

      - name: Install dependencies
        working-directory: fastapi
        run: pip install -r requirements.txt

      - name: Check Python modules
        working-directory: fastapi
        run: python -m compileall .
